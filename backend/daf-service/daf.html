<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>DAF Practice — Clario</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: #0f1b2d;
      color: #ffffff;
      padding: 24px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #7eb8f7;
      font-weight: 700;
    }

    .sub {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 32px;
    }

    .status {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      padding: 14px 16px;
      border-radius: 12px;
      text-align: center;
      background: #1c2f47;
      border: 1px solid #2a4060;
      transition: background 0.3s ease;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-start {
      background: linear-gradient(135deg, #3a86ff, #2563eb);
      color: white;
      box-shadow: 0 4px 16px rgba(58, 134, 255, 0.35);
    }

    .btn-stop {
      background: linear-gradient(135deg, #e63946, #c1121f);
      color: white;
      display: none;
      box-shadow: 0 4px 16px rgba(230, 57, 70, 0.35);
    }

    .slider-wrap {
      margin-top: 28px;
      background: #1c2f47;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #2a4060;
    }

    label {
      font-size: 13px;
      color: #aaaaaa;
      display: block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #3a86ff;
      height: 6px;
      cursor: pointer;
    }

    .delay-val {
      font-size: 36px;
      font-weight: 700;
      color: #7eb8f7;
      text-align: center;
      margin-top: 12px;
    }

    .delay-val span {
      font-size: 18px;
      font-weight: 400;
      color: #aaaaaa;
      margin-left: 4px;
    }

    .tip {
      font-size: 13px;
      color: #888888;
      margin-top: 24px;
      line-height: 1.7;
      background: #1c2f47;
      border-radius: 12px;
      padding: 16px;
      border-left: 3px solid #3a86ff;
    }

    .tip strong {
      color: #f4a261;
    }

    .pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <h1>DAF Practice</h1>
  <p class="sub">Delayed Auditory Feedback — use wired headphones</p>

  <div class="status" id="status">Ready to start</div>

  <button class="btn-start" id="startBtn" onclick="startDAF()">&#9654; Start Session</button>
  <button class="btn-stop" id="stopBtn" onclick="stopDAF()">&#9632; Stop Session</button>

  <div class="slider-wrap">
    <label>Delay Amount</label>
    <input type="range" id="delaySlider" min="50" max="250" value="150"
           oninput="updateDelay(this.value)">
    <div class="delay-val"><span id="delayVal">150</span><span>ms</span></div>
  </div>

  <p class="tip">
    <strong>&#9888; Bluetooth headphones add their own delay.</strong><br>
    Use wired headphones only for accurate DAF.<br><br>
    Start at <strong>150 ms</strong> and adjust until speech slows naturally.
    Most people find their sweet spot between 100–200 ms.
  </p>

  <script>
    let ctx, src, delay, stream;

    function updateDelay(v) {
      document.getElementById('delayVal').textContent = v;
      if (delay) delay.delayTime.value = v / 1000;
    }

    async function startDAF() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        ctx = new (window.AudioContext || window.webkitAudioContext)();
        src = ctx.createMediaStreamSource(stream);
        delay = ctx.createDelay(1.0);
        delay.delayTime.value = document.getElementById('delaySlider').value / 1000;

        src.connect(delay);
        delay.connect(ctx.destination);

        const status = document.getElementById('status');
        status.textContent = '\uD83C\uDFA4 Listening — speak now';
        status.style.background = '#1a4a2e';
        status.style.borderColor = '#2d7a4e';
        status.classList.add('pulse');

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';

      } catch (e) {
        const status = document.getElementById('status');
        status.textContent = 'Mic error: ' + e.message;
        status.style.background = '#4a1a1a';
      }
    }

    function stopDAF() {
      if (ctx) ctx.close();
      if (stream) stream.getTracks().forEach(t => t.stop());

      const status = document.getElementById('status');
      status.textContent = 'Session ended';
      status.style.background = '#1c2f47';
      status.style.borderColor = '#2a4060';
      status.classList.remove('pulse');

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      // Notify Flutter WebView that the session ended (for self-report prompt)
      if (window.Flutter) {
        window.Flutter.postMessage('session_ended');
      }
    }
  </script>
</body>
</html>
